# Render blueprint (https://render.com) - free-tier deployment.
# Create a new Blueprint from this repo on Render, or deploy the web service
# manually with the Dockerfile.
#
# NOTE: the free Postgres database below is persistent; uploaded enrollment
# photos live on the instance's ephemeral disk and are reset on redeploy.
# For a permanent deployment, mount a persistent disk or use object storage.

databases:
  - name: stem-attendance-db
    plan: free
    databaseName: attendance

services:
  - type: web
    name: stem-attendance-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stem-attendance-db
          property: connectionString
      - key: DATA_DIR
        value: /app/data
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: None
      # Allow the SPA frontend (Vercel) to call this API with credentials.
      - key: CORS_ALLOWED_ORIGINS
        value: https://stem-attendance-six.vercel.app,https://stem-attendance.vercel.app
      - key: RENDER
        value: true
      - key: ALLOW_REGISTRATION
        value: true
      - key: LOG_LEVEL
        value: INFO
